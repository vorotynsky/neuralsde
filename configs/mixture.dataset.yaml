# Parameters used only to generate the reusable trajectory dataset.
steps: 100
horizon: 2.0
seed: 8

samplers:
  - type: ou
    paths: 512
    params:
      theta: 1.2
      mu: -1.0
      sigma: 0.45

  - type: cir
    paths: 256
    params:
      kappa: 1.2
      theta: 1.0
      sigma: 0.35

  - type: brownian_bridge
    paths: 256
    params:
      x1: 0.0
      sigma: 0.6
