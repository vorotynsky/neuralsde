[project]
name = "neuralsde"
version = "0.1.0"
description = "Latent NeuralSDE implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
]

[project.scripts]
neuralsde = "neuralsde.latent_sde.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
